[workspace]
resolver = "2"
members = [
    "crates/nativum-core",
    "crates/nativum-markup",
    "crates/nativum-engine",
    "crates/nativum-cli",
    "crates/nativum",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
authors = ["Haru"]
repository = "https://github.com/haru0416-dev/nativum"

[workspace.dependencies]
nativum-core = { path = "crates/nativum-core", version = "0.1.0" }
nativum-markup = { path = "crates/nativum-markup", version = "0.1.0" }
nativum-engine = { path = "crates/nativum-engine", version = "0.1.0" }
nativum = { path = "crates/nativum", version = "0.1.0" }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
clap = { version = "=4.5.23", features = ["derive"] }
anyhow = "=1.0.94"
winit = { version = "=0.30.9", default-features = false, features = ["rwh_06", "x11"] }
softbuffer = { version = "=0.4.6", default-features = false, features = ["x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
